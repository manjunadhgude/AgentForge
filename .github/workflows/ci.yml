name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_DB: agentforge
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENTFORGE_DB_HOST: 127.0.0.1
      AGENTFORGE_DB_PORT: 5432
      AGENTFORGE_DB_NAME: agentforge
      AGENTFORGE_DB_USER: agentforge
      AGENTFORGE_DB_PASSWORD: agentforge_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run matched reliability benchmark
        run: python benchmarks/run_execution_comparison.py
      - name: Upload matched reliability report
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-matched-reliability-report
          path: reports/agentforge_matched_reliability.json
          if-no-files-found: error
